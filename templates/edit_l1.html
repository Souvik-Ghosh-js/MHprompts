{% extends "base.html" %}

{% block title %}Edit L1 Prompt{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-pencil"></i> Edit L1 Prompt</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Prompt ID</label>
                        <input type="text" class="form-control" value="{{ prompt.PromptID }}" disabled>
                        <small class="text-muted">Prompt ID cannot be changed</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="l1_prompt" class="form-label">L1 Prompt Text *</label>
                        <textarea class="form-control" id="l1_prompt" name="l1_prompt" 
                                  rows="6" required>{{ prompt.L1_Prompt }}</textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="client_id" class="form-label">Client ID</label>
                            <input type="text" class="form-control" id="client_id" name="client_id" 
                                   value="{{ prompt.ClientId or '' }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="is_active" 
                                       id="active" value="Y" {% if prompt.IsActive == 'Y' %}checked{% endif %}>
                                <label class="form-check-label" for="active">
                                    Active
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="is_active" 
                                       id="inactive" value="N" {% if prompt.IsActive != 'Y' %}checked{% endif %}>
                                <label class="form-check-label" for="inactive">
                                    Inactive
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Created On</label>
                            <input type="text" class="form-control" 
                                   value="{{ prompt.CreatedOn }}" disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Modified</label>
                            <input type="text" class="form-control" 
                                   value="{{ prompt.LastModifiedDate }}" disabled>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('l1_prompts') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Update Prompt
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
